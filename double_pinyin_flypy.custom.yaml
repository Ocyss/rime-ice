__include: octagram   #启用语法模型
#语法模型
octagram:
  __patch:
    grammar:
      language: wanxiang-lts-zh-hans
      collocation_max_length: 5
      collocation_min_length: 2
    translator/contextual_suggestions: true
    translator/max_homophones: 7
    translator/max_homographs: 7


patch:
  switches:
  - name: ascii_mode
    states: [ 中, Ａ ]
  - name: ascii_punct  # 中英标点
    states: [ $, ¥ ]
  - name: traditionalization
    states: [ 简, 繁 ]
  - name: emoji
    states: [ 💀, 😄 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: search_single_char  # search.lua 的功能开关，辅码查词时是否单字优先
    states: [正常, 单字]
    abbrev: [词, 单]

  translator/preedit_format: []

  engine/processors:
    - lua_processor@*select_character  # 以词定字
    - ascii_composer
    - recognizer
    - key_binder
    - lua_processor@*numen.rime*P
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor

  engine/translators:
      - punct_translator
      - script_translator
      - lua_translator@*date_translator # 时间、日期、星期
      - lua_translator@*lunar # 农历
      - table_translator@custom_phrase # 自定义短语 custom_phrase_double.txt
      - table_translator@melt_eng # 英文输入
      - table_translator@cn_en # 中英混合词汇
      - table_translator@radical_lookup # 部件拆字反查
      - lua_translator@*unicode # Unicode
      - lua_translator@*number_translator # 数字、金额大写
      # - lua_translator@*calc_translator    # 计算器
      - lua_translator@*numen.rime*T
      - lua_translator@*force_gc # 暴力 GC

  engine/filters:
    - lua_filter@*corrector                         # 错音错字提示
    - reverse_lookup_filter@radical_reverse_lookup  # 部件拆字滤镜
    - lua_filter@*autocap_filter                    # 英文自动大写
    - lua_filter@*pin_cand_filter                   # 置顶候选项（顺序要求：置顶候选项 > Emoji > 简繁切换）
    - lua_filter@*reduce_english_filter             # 降低部分英语单词在候选项的位置
    - simplifier@emoji                              # Emoji
    - simplifier@traditionalize                     # 简繁切换
    - lua_filter@*search@radical_pinyin             # 部件拆字辅码
    - uniquifier

  recognizer/patterns:
    numen: "^cC.+"
